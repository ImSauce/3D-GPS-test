<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AR Navigator</title>
<style>
:root{--bg:#0b0f14;--panel:#121923;--line:#223042;--text:#e8f0f8;--mute:#8fa3b8;--accent:#27d3ff;--ok:#2ee59d;--warn:#ffb020;--bad:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;border-radius:16px;min-height:56px;padding:0 20px;background:#1b2635;font-weight:600;font-size:17px}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#04202a}
button.danger{background:#3a1c22;color:#ff9a9a}
input{width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line);background:#0d141d;color:var(--text);padding:0 16px;font-size:16px;-webkit-user-select:text;user-select:text}
input:focus{outline:2px solid var(--accent);border-color:transparent}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;background:radial-gradient(circle at 50% 30%,#14212f,#0b0f14 70%)}
#start h1{margin:0;font-size:32px}
#start p{margin:0;color:var(--mute);max-width:320px;line-height:1.5}
#start button{width:100%;max-width:320px;min-height:68px;font-size:22px}
#startMsg{color:var(--warn);font-size:14px;min-height:20px;max-width:320px}
#ar{position:fixed;inset:0;display:none}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05080c}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0) 28%,rgba(0,0,0,0) 65%,rgba(0,0,0,.6))}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;text-align:center;pointer-events:none}
#tname{font-size:16px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dist{font-size:64px;font-weight:800;line-height:1.05;letter-spacing:-1px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#hint{font-size:18px;font-weight:600;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.7);min-height:24px}
#acc{margin-top:6px;font-size:13px;color:var(--mute)}
#banner{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 150px);padding:12px 14px;border-radius:14px;background:rgba(60,40,0,.88);border:1px solid var(--warn);color:#ffd88a;font-size:15px;line-height:1.35;display:none;text-align:center}
#stage{position:absolute;left:50%;top:56%;width:0;height:0;perspective:700px}
#bob{position:absolute;left:0;top:0;transform-style:preserve-3d;animation:bob 2.2s ease-in-out infinite}
#arrow{position:absolute;width:150px;height:210px;left:-75px;top:-105px;transform-style:preserve-3d;--hue:190}
#arrow.aligned{--hue:150}
#arrow.hidden{display:none}
.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#bar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:12px}
#bar button{flex:1;min-height:64px;font-size:19px;background:rgba(18,25,35,.92);border:1px solid var(--line)}
#bar button.primary{background:var(--accent);border:0}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:86dvh;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .28s ease}
#sheet.open{transform:translateY(0)}
#sheet h2{margin:4px 0 12px;font-size:20px}
.row{display:flex;gap:10px;margin-bottom:10px}
.row>*{flex:1}
.sec{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;background:#0d141d;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.item.sel{border-color:var(--accent);background:#0e2230}
.item .info{flex:1;min-width:0;padding:6px}
.item .nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .co{font-size:13px;color:var(--mute);margin-top:2px}
.item .sm{min-height:46px;padding:0 14px;font-size:14px;border-radius:12px}
.empty{color:var(--mute);text-align:center;padding:16px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);transform:translateX(-50%);background:#1b2635;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:60;font-size:15px;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="start">
<h1>AR Navigator</h1>
<p>Point your camera and follow the arrow to your saved destination.</p>
<p>Tap Start and allow Camera, Location, and Motion access.</p>
<button id="startBtn" class="primary">Start</button>
<div id="startMsg"></div>
</div>

<div id="ar">
<video id="cam" playsinline muted autoplay></video>
<div id="shade"></div>
<div id="hud">
<div id="tname">No destination</div>
<div id="dist">--</div>
<div id="hint"></div>
<div id="acc"></div>
</div>
<div id="banner"></div>
<div id="stage"><div id="bob"><div id="arrow" class="hidden"></div></div></div>
<div id="bar">
<button id="openSheet" class="primary">Destinations</button>
</div>
</div>

<div id="backdrop"></div>
<div id="sheet">
<h2>Destinations</h2>
<div class="sec">Add destination</div>
<div class="row"><input id="inName" type="text" placeholder="Name (optional)" autocomplete="off"></div>
<div class="row"><input id="inCoord" type="text" inputmode="text" placeholder="lat,lng  e.g. 14.5995,120.9842" autocomplete="off"></div>
<div class="row">
<button id="addCoord" class="primary">Add &amp; navigate</button>
<button id="saveHere">Save my current location</button>
</div>
<div class="sec">Saved markers</div>
<div id="list"></div>
<div class="row">
<button id="clearTarget">Clear target</button>
<button id="closeSheet">Close</button>
</div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";

const store={
  key:"arnav.markers.v1",
  selKey:"arnav.selected.v1",
  async list(){
    try{return JSON.parse(localStorage.getItem(this.key)||"[]")}catch(e){return []}
  },
  async saveAll(items){
    localStorage.setItem(this.key,JSON.stringify(items));
  },
  async add(name,lat,lng){
    const items=await this.list();
    const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,lat:lat,lng:lng};
    items.push(m);
    await this.saveAll(items);
    return m;
  },
  async rename(id,name){
    const items=await this.list();
    const m=items.find(x=>x.id===id);
    if(m){m.name=name;await this.saveAll(items)}
  },
  async remove(id){
    const items=(await this.list()).filter(x=>x.id!==id);
    await this.saveAll(items);
    if(await this.getSelectedId()===id){await this.setSelectedId(null)}
  },
  async getSelectedId(){
    return localStorage.getItem(this.selKey);
  },
  async setSelectedId(id){
    if(id){localStorage.setItem(this.selKey,id)}else{localStorage.removeItem(this.selKey)}
  }
};

const $=id=>document.getElementById(id);
const R=6371000;
const rad=d=>d*Math.PI/180;
const deg=r=>r*180/Math.PI;

let markers=[];
let selectedId=null;
let pos=null;
let rawHeading=null;
let smooth=null;
let lastHeadingAt=0;
let started=false;
let wakeLock=null;

function haversine(lat1,lng1,lat2,lng2){
  const p1=rad(lat1),p2=rad(lat2);
  const dp=rad(lat2-lat1),dl=rad(lng2-lng1);
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearingTo(lat1,lng1,lat2,lng2){
  const p1=rad(lat1),p2=rad(lat2),dl=rad(lng2-lng1);
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (deg(Math.atan2(y,x))+360)%360;
}

function fmtDist(m){
  if(m>=1000){return (m/1000).toFixed(m>=10000?1:2)+" km"}
  return Math.round(m)+" m";
}

function toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.style.display="block";
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>{t.style.display="none"},2600);
}

function buildArrow(){
  const arrow=$("arrow");
  const ns="http://www.w3.org/2000/svg";
  const pts="50,0 100,62 68,62 68,140 32,140 32,62 0,62";
  const shadow=document.createElementNS(ns,"svg");
  shadow.setAttribute("viewBox","0 0 100 140");
  shadow.setAttribute("class","layer");
  shadow.style.transform="translateZ(-34px) scale(1.08)";
  shadow.style.filter="blur(9px)";
  const sp=document.createElementNS(ns,"polygon");
  sp.setAttribute("points",pts);
  sp.setAttribute("fill","rgba(0,0,0,.55)");
  shadow.appendChild(sp);
  arrow.appendChild(shadow);
  const n=14;
  for(let i=0;i<n;i++){
    const svg=document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 100 140");
    svg.setAttribute("class","layer");
    svg.style.transform="translateZ("+(i*3-18)+"px)";
    const p=document.createElementNS(ns,"polygon");
    p.setAttribute("points",pts);
    const light=18+i*3.4;
    p.style.fill="hsl(var(--hue),85%,"+light+"%)";
    if(i===n-1){
      p.style.stroke="rgba(255,255,255,.75)";
      p.setAttribute("stroke-width","2");
      p.setAttribute("stroke-linejoin","round");
    }
    svg.appendChild(p);
    arrow.appendChild(svg);
  }
}

function compassFromEuler(alpha,beta,gamma){
  const z=rad(alpha),x=rad(beta||0),y=rad(gamma||0);
  const cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z);
  const vx=-cZ*sY-sZ*sX*cY;
  const vy=-sZ*sY+cZ*sX*cY;
  let h=Math.atan2(vx,vy);
  if(h<0){h+=2*Math.PI}
  return deg(h);
}

function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number"&&!isNaN(e.webkitCompassHeading)){
    h=e.webkitCompassHeading;
  }else if(e.alpha!==null&&e.alpha!==undefined&&(e.type==="deviceorientationabsolute"||e.absolute===true)){
    h=compassFromEuler(e.alpha,e.beta,e.gamma);
  }
  if(h===null){return}
  rawHeading=(h%360+360)%360;
  lastHeadingAt=Date.now();
}

async function askOrientation(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=="granted"){return "Motion access denied. Enable it in Safari settings."}
    }
    if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
      try{await DeviceMotionEvent.requestPermission()}catch(e){}
    }
  }catch(e){
    return "Motion access failed: "+(e&&e.message?e.message:e);
  }
  window.addEventListener("deviceorientationabsolute",onOrient,true);
  window.addEventListener("deviceorientation",onOrient,true);
  return "";
}

async function askCamera(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return "Camera not supported in this browser."}
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    const v=$("cam");
    v.srcObject=stream;
    v.setAttribute("playsinline","");
    v.muted=true;
    try{await v.play()}catch(e){}
    return "";
  }catch(e){
    return "Camera unavailable: "+(e&&e.message?e.message:e);
  }
}

function askLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){resolve("Location not supported in this browser.");return}
    let done=false;
    navigator.geolocation.watchPosition(p=>{
      pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      if(!done){done=true;resolve("")}
    },err=>{
      if(!done){done=true;resolve(err.code===1?"Location access denied.":"Location error: "+err.message)}
      else{pos=pos}
    },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
    setTimeout(()=>{if(!done){done=true;resolve("")}},4000);
  });
}

async function keepAwake(){
  try{
    if(navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}
  }catch(e){}
}

function currentTarget(){
  return markers.find(m=>m.id===selectedId)||null;
}

function render(){
  const arrow=$("arrow");
  const banner=$("banner");
  const msgs=[];
  if(!pos){msgs.push("Waiting for GPS signal...")}
  else if(pos.acc>30){msgs.push("Weak GPS: accuracy is about "+Math.round(pos.acc)+" m (worse than 30 m). Go outside or move to open sky. Distance and direction may be wrong.")}
  if(started&&Date.now()-lastHeadingAt>3000&&rawHeading===null){msgs.push("No compass data yet. Allow Motion access and move your phone in a figure 8.")}
  if(msgs.length){banner.textContent=msgs.join(" ");banner.style.display="block"}else{banner.style.display="none"}
  $("acc").textContent=pos?"GPS \u00B1"+Math.round(pos.acc)+" m":"GPS searching";

  const t=currentTarget();
  if(!t){
    $("tname").textContent="No destination";
    $("dist").textContent="--";
    $("hint").textContent="Open Destinations to pick one";
    arrow.classList.add("hidden");
    return;
  }
  $("tname").textContent=t.name;
  if(!pos){
    $("dist").textContent="--";
    $("hint").textContent="";
    arrow.classList.add("hidden");
    return;
  }
  const d=haversine(pos.lat,pos.lng,t.lat,t.lng);
  const b=bearingTo(pos.lat,pos.lng,t.lat,t.lng);
  $("dist").textContent=fmtDist(d);
  if(d<8){
    $("hint").textContent="You have arrived";
    arrow.classList.add("hidden");
    return;
  }
  if(smooth===null){
    $("hint").textContent="Waiting for compass...";
    arrow.classList.add("hidden");
    return;
  }
  let rel=((b-smooth)%360+360)%360;
  const signed=rel>180?rel-360:rel;
  arrow.classList.remove("hidden");
  arrow.style.transform="rotateX(62deg) rotateZ("+rel.toFixed(1)+"deg)";
  const aligned=Math.abs(signed)<=10;
  arrow.classList.toggle("aligned",aligned);
  $("hint").textContent=aligned?"Straight ahead":(signed>0?"Turn right "+Math.round(signed)+"\u00B0":"Turn left "+Math.round(-signed)+"\u00B0");
}

function frame(){
  if(rawHeading!==null){
    if(smooth===null){smooth=rawHeading}
    else{
      const d=((rawHeading-smooth+540)%360)-180;
      smooth=(smooth+d*0.12+360)%360;
    }
  }
  render();
  requestAnimationFrame(frame);
}

async function refreshList(){
  markers=await store.list();
  selectedId=await store.getSelectedId();
  if(selectedId&&!markers.some(m=>m.id===selectedId)){selectedId=null;await store.setSelectedId(null)}
  const box=$("list");
  box.textContent="";
  if(!markers.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="No saved markers yet.";
    box.appendChild(e);
    return;
  }
  markers.forEach(m=>{
    const row=document.createElement("div");
    row.className="item"+(m.id===selectedId?" sel":"");
    const info=document.createElement("div");
    info.className="info";
    info.dataset.act="select";
    info.dataset.id=m.id;
    const nm=document.createElement("div");
    nm.className="nm";
    nm.textContent=(m.id===selectedId?"\u25CF ":"")+m.name;
    const co=document.createElement("div");
    co.className="co";
    let extra="";
    if(pos){extra="  \u2022  "+fmtDist(haversine(pos.lat,pos.lng,m.lat,m.lng))}
    co.textContent=m.lat.toFixed(5)+", "+m.lng.toFixed(5)+extra;
    info.appendChild(nm);
    info.appendChild(co);
    const ren=document.createElement("button");
    ren.className="sm";
    ren.textContent="Rename";
    ren.dataset.act="rename";
    ren.dataset.id=m.id;
    const del=document.createElement("button");
    del.className="sm danger";
    del.textContent="Delete";
    del.dataset.act="delete";
    del.dataset.id=m.id;
    row.appendChild(info);
    row.appendChild(ren);
    row.appendChild(del);
    box.appendChild(row);
  });
}

function openSheet(){
  refreshList();
  $("backdrop").style.display="block";
  $("sheet").classList.add("open");
}

function closeSheet(){
  $("sheet").classList.remove("open");
  $("backdrop").style.display="none";
}

function parseCoord(s){
  const m=String(s).trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m){return null}
  const lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  if(lat<-90||lat>90||lng<-180||lng>180){return null}
  return {lat:lat,lng:lng};
}

$("list").addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el){return}
  const id=el.dataset.id;
  const act=el.dataset.act;
  if(act==="select"){
    await store.setSelectedId(id);
    await refreshList();
    closeSheet();
    toast("Target selected");
  }else if(act==="rename"){
    const m=markers.find(x=>x.id===id);
    const n=prompt("New name",m?m.name:"");
    if(n&&n.trim()){await store.rename(id,n.trim());await refreshList()}
  }else if(act==="delete"){
    const m=markers.find(x=>x.id===id);
    if(confirm("Delete \""+(m?m.name:"marker")+"\"?")){await store.remove(id);await refreshList()}
  }
});

$("addCoord").addEventListener("click",async()=>{
  const c=parseCoord($("inCoord").value);
  if(!c){toast("Enter coordinates like 14.5995,120.9842");return}
  const name=$("inName").value.trim()||("Marker "+(markers.length+1));
  const m=await store.add(name,c.lat,c.lng);
  await store.setSelectedId(m.id);
  $("inName").value="";
  $("inCoord").value="";
  await refreshList();
  closeSheet();
  toast("Navigating to "+name);
});

$("saveHere").addEventListener("click",async()=>{
  if(!pos){toast("No GPS fix yet. Please wait.");return}
  const name=$("inName").value.trim()||("Marker "+(markers.length+1));
  await store.add(name,pos.lat,pos.lng);
  $("inName").value="";
  await refreshList();
  toast("Saved: "+name+(pos.acc>30?" (weak GPS \u00B1"+Math.round(pos.acc)+" m)":""));
});

$("clearTarget").addEventListener("click",async()=>{
  await store.setSelectedId(null);
  await refreshList();
  closeSheet();
});

$("openSheet").addEventListener("click",openSheet);
$("closeSheet").addEventListener("click",closeSheet);
$("backdrop").addEventListener("click",closeSheet);

$("startBtn").addEventListener("click",async()=>{
  const btn=$("startBtn");
  btn.disabled=true;
  btn.textContent="Requesting access...";
  const pOri=askOrientation();
  const pCam=askCamera();
  const pLoc=askLocation();
  const results=await Promise.all([pOri,pCam,pLoc]);
  const errors=results.filter(Boolean);
  await refreshList();
  buildArrow();
  $("start").style.display="none";
  $("ar").style.display="block";
  started=true;
  keepAwake();
  requestAnimationFrame(frame);
  if(errors.length){toast(errors[0])}
  if(!markers.length){openSheet()}
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&started){keepAwake()}
});

(function init(){
  if(!window.isSecureContext){
    $("startMsg").textContent="This page must be opened over HTTPS for camera, GPS and compass to work.";
  }
  try{
    const icon="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#0b0f14'/><polygon points='50,14 80,58 60,58 60,86 40,86 40,58 20,58' fill='#27d3ff'/></svg>");
    const mf={name:"AR Navigator",short_name:"ARNav",start_url:location.href,display:"fullscreen",orientation:"portrait",background_color:"#0b0f14",theme_color:"#0b0f14",icons:[{src:icon,sizes:"any",type:"image/svg+xml"}]};
    const link=document.createElement("link");
    link.rel="manifest";
    link.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));
    document.head.appendChild(link);
    const ai=document.createElement("link");
    ai.rel="apple-touch-icon";
    ai.href=icon;
    document.head.appendChild(ai);
  }catch(e){}
})();
})();
</script>
</body>
</html>
